{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">
    🧀 Gestión de Ingredientes
</h2>

<a href="{% url 'crear_ingrediente' %}"
   class="btn btn-success mb-3">
    ➕ Nuevo Ingrediente
</a>

<table class="table table-striped table-hover">

    <thead class="table-dark">

        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Acciones</th>
        </tr>

    </thead>

    <tbody>

    {% for ingrediente in ingredientes %}

        <tr>

            <td>{{ ingrediente.id }}</td>
            <td>{{ ingrediente.nombre }}</td>

            <td>

                <a href="{% url 'editar_ingrediente' ingrediente.id %}"
                   class="btn btn-warning btn-sm">
                    Editar
                </a>

                <a href="{% url 'eliminar_ingrediente' ingrediente.id %}"
                   class="btn btn-danger btn-sm">
                    Eliminar
                </a>

            </td>

        </tr>

    {% empty %}

        <tr>
            <td colspan="3">
                No hay ingredientes registrados.
            </td>
        </tr>

    {% endfor %}

    </tbody>

</table>

{% endblock %}
