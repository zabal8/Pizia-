{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">
    🍕 Gestión de Pizzas
</h2>

<a href="{% url 'crear_pizza' %}"
   class="btn btn-success mb-3">
    ➕ Nueva Pizza
</a>

<table class="table table-striped table-hover">

    <thead class="table-dark">

        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Acciones</th>
        </tr>

    </thead>

    <tbody>

    {% for pizza in pizzas %}

        <tr>

            <td>{{ pizza.id }}</td>
            <td>{{ pizza.nombre }}</td>
            <td>${{ pizza.precio }}</td>

            <td>

                <a href="{% url 'editar_pizza' pizza.id %}"
                   class="btn btn-warning btn-sm">
                    Editar
                </a>

                <a href="{% url 'eliminar_pizza' pizza.id %}"
                   class="btn btn-danger btn-sm">
                    Eliminar
                </a>

            </td>

        </tr>

    {% empty %}

        <tr>
            <td colspan="4">
                No hay pizzas registradas.
            </td>
        </tr>

    {% endfor %}

    </tbody>

</table>

{% endblock %}
