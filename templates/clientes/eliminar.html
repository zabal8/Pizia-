{% extends 'base.html' %}

{% block content %}

<h2>Eliminar Cliente</h2>

{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

<p>
    ¿Está seguro de eliminar a
    <strong>{{ cliente.nombre }}</strong>?
</p>

<form method="post">

    {% csrf_token %}

    <button type="submit"
            class="btn btn-danger">
        Eliminar
    </button>

    <a href="{% url 'lista_clientes' %}"
       class="btn btn-secondary">
       Cancelar
    </a>

</form>

{% endblock %}
