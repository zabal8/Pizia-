<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PizIA - Sistema de Gestión de Pizzería</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background-color:#fffaf4;
        }

        .navbar{background-color:#8f2d20!important;}
        .btn-success{background-color:#287a45;border-color:#287a45;}
        .card-custom{background:#fffdf9;}

        .navbar-brand{
            font-weight:bold;
            font-size:1.5rem;
        }

        .card-custom{
            border:none;
            border-radius:15px;
            box-shadow:0 2px 10px rgba(0,0,0,.1);
        }

        footer{
            margin-top:50px;
            padding:20px;
            text-align:center;
            color:gray;
        }

    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            🍕 PizIA
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/">
                        Clientes
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/ingredientes/">
                        Ingredientes
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/pizzas/">
                        Pizzas
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/pedidos/">
                        Pedidos
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/pagos/">
                        Pagos
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/admin/">
                        Administración
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>

<div class="container mt-4">

    <div class="card card-custom">

        <div class="card-body">

            {% block content %}
            {% endblock %}

        </div>

    </div>

</div>

<footer>

    <hr>

    <p>
        Sistema PizIA © 2026
    </p>

    <p>
        Análisis y Desarrollo de Software - ADSO
    </p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
