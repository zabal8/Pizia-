{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PizIA - Sistema de Gestión de Pizzería</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        :root{
            --pizia-blue:#1453b8;
            --pizia-blue-dark:#0e3f91;
            --pizia-pink:#f2a8ca;
            --pizia-pink-dark:#d95796;
            --pizia-pink-light:#fff0f7;
            --pizia-page:#f4f7ff;
        }

        body{
            background-color:var(--pizia-page);
            color:#24324b;
        }

        .navbar{background-color:var(--pizia-blue)!important;}

        .navbar-brand{
            display:flex;
            align-items:center;
            gap:.65rem;
            color:#fff!important;
        }

        .brand-logo{
            width:52px;
            height:52px;
            object-fit:cover;
            object-position:center;
            border:2px solid var(--pizia-pink);
            border-radius:50%;
            background:#fff;
            padding:2px;
        }

        .navbar .nav-link{color:#fff;transition:color .15s ease-in-out;}
        .navbar .nav-link:hover,.navbar .nav-link:focus{color:var(--pizia-pink);}
        .navbar-toggler{border-color:var(--pizia-pink);}

        .btn-success,.btn-primary{
            background-color:var(--pizia-blue);
            border-color:var(--pizia-blue);
        }

        .btn-success:hover,.btn-primary:hover{
            background-color:var(--pizia-pink-dark);
            border-color:var(--pizia-pink-dark);
        }

        .btn-warning{
            color:var(--pizia-blue-dark);
            background-color:var(--pizia-pink);
            border-color:var(--pizia-pink);
        }

        .btn-warning:hover{
            color:#fff;
            background-color:var(--pizia-pink-dark);
            border-color:var(--pizia-pink-dark);
        }

        .table-dark{
            --bs-table-bg:var(--pizia-blue-dark);
            --bs-table-color:#fff;
            --bs-table-border-color:#315fa4;
        }

        .navbar-brand span{
            font-weight:bold;
            font-size:1.5rem;
        }

        .card-custom{
            background:#fff;
            border:none;
            border-radius:15px;
            box-shadow:0 2px 12px rgba(20,83,184,.10);
        }

        footer{
            margin-top:50px;
            padding:20px;
            text-align:center;
            color:#64748b;
        }

    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            <img class="brand-logo" src="{% static 'img/pizia-logo.png' %}" alt="Logotipo de PizIA">
            <span>PizIA</span>
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/">
                        Clientes
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/ingredientes/">
                        Ingredientes
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/pizzas/">
                        Pizzas
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/pedidos/">
                        Pedidos
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/pagos/">
                        Pagos
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/admin/">
                        Administración
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>

<div class="container mt-4">

    <div class="card card-custom">

        <div class="card-body">

            {% block content %}
            {% endblock %}

        </div>

    </div>

</div>

<footer>

    <hr>

    <p>
        Sistema PizIA © 2026
    </p>

    <p>
        Análisis y Desarrollo de Software - ADSO
    </p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
